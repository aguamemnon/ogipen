name: OGIPEN C# desktop build
on:
  push:
    branches: [modernisation-csharp]
    paths:
      - 'src/OGIPEN.Desktop/**'
      - 'src/OGIPEN.Core/**'
      - 'tests/OGIPEN.Core.Checks/**'
      - 'tests/OGIPEN.Desktop.Smoke/**'
      - 'OGIPEN.CSharp.sln'
      - '.github/workflows/ogipen-csharp.yml'
  pull_request:
    paths:
      - 'src/OGIPEN.Desktop/**'
      - 'src/OGIPEN.Core/**'
      - 'tests/OGIPEN.Core.Checks/**'
      - 'tests/OGIPEN.Desktop.Smoke/**'
      - 'OGIPEN.CSharp.sln'
      - '.github/workflows/ogipen-csharp.yml'
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate OGIPEN.Core on Linux
        run: dotnet run --project tests/OGIPEN.Core.Checks/OGIPEN.Core.Checks.csproj --configuration Release --no-launch-profile

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OGIPEN.CSharp.sln
      - name: Build
        run: dotnet build OGIPEN.CSharp.sln --configuration Release --no-restore -warnaserror
      - name: Smoke test — construction du ruban et du MainForm
        run: dotnet run --project tests/OGIPEN.Desktop.Smoke/OGIPEN.Desktop.Smoke.csproj --configuration Release --no-launch-profile

      - name: Publish Windows x64 standalone
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          dotnet publish src/OGIPEN.Desktop/OGIPEN.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
          Compress-Archive -Path publish/win-x64/* -DestinationPath OGIPEN-CSharp-win-x64.zip -Force
      - name: Upload Windows application
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: OGIPEN-CSharp-win-x64
          path: OGIPEN-CSharp-win-x64.zip
          if-no-files-found: error
          retention-days: 14
