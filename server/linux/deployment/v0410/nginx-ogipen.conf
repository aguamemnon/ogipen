log_format ogipen_api_sanitized '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $ogipen_api_connection {
    default upgrade;
    "" close;
}
map $http_x_ogipen_client_ip $ogipen_client_ip {
    default $http_x_ogipen_client_ip;
    "" $remote_addr;
}


# Primary portal access on the MySQL server, private LAN only.
server {
    listen 192.168.2.216:8080;
    listen 127.0.0.1:8080;
    server_name 192.168.2.216 localhost;
    server_tokens off;
    allow 192.168.2.0/24;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 80k;
    location = / { rewrite ^ /index.php last; }
    location = /style.css {
        root /opt/ogipen/public;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/(index|login|logout|license-status|status)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ogipen/admin$fastcgi_script_name;
        fastcgi_param HTTPS off;
        fastcgi_param OGIPEN_BASE_PATH /;
        fastcgi_pass unix:/run/ogipen-admin/php-fpm.sock;
        fastcgi_read_timeout 25s;
        fastcgi_hide_header X-Powered-By;
    }
    location / { return 404; }
}

# Company-local API: no WordPress relay and no SQL exposure.
server {
    listen 192.168.2.216:443 ssl;
    server_name 192.168.2.216;
    ssl_certificate /etc/ogipen/tls/company-server.crt;
    ssl_certificate_key /etc/ogipen/tls/company-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    allow 192.168.2.0/24;
    deny all;
    client_max_body_size 80k;
    access_log /var/log/nginx/ogipen-api-access.log ogipen_api_sanitized;
    location = / { return 302 /health; }
    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ogipen_api_connection;
        proxy_read_timeout 65s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
